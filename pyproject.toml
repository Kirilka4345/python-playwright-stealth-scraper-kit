[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-stealth-scraper"
version = "1.1.0"
authors = [
  { name="Kirill", email="kirillopen4345@gmail.com" },
]
description = "Production-grade Async Playwright Stealth Web Scraper with Anti-Bot Fingerprint Evasion"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "playwright>=1.40.0",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/python-playwright-stealth-scraper-kit"
"Commercial License" = "https://kirillopen.gumroad.com/l/xjajr"
"Funding" = "https://kirillopen.gumroad.com"
