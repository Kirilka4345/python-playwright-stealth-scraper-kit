[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-stealth-scraper"
version = "1.1.0"
authors = [
  { name="Kirill" },
]
description = "A synchronous Playwright example with a persistent Chromium profile."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "playwright>=1.40.0",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/python-playwright-stealth-scraper-kit"


[tool.setuptools]
py-modules = ["stealth_scraper"]
